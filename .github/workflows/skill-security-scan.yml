name: Skill Security Scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/**'
      - '.github/workflows/skill-security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/skill-security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snyk-agent-scan:
    name: Snyk Agent Scan
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Snyk configuration
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SNYK_TOKEN is not configured; skill security scanning was skipped."
            {
              echo "### Snyk Agent Scan"
              echo
              echo "Skipped because the repository secret \`SNYK_TOKEN\` is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out scanned revision
        if: steps.snyk.outputs.enabled == 'true' && github.event_name != 'pull_request_target'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed skills
        if: steps.snyk.outputs.enabled == 'true'
        id: targets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path, PurePosixPath

          api_root = "https://api.github.com"
          token = os.environ["GH_TOKEN"]
          repository = os.environ["HEAD_REPOSITORY"]
          head_sha = os.environ["HEAD_SHA"]
          pr_number = os.environ["PR_NUMBER"]

          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit(f"Invalid head repository: {repository}")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit(f"Invalid head SHA: {head_sha}")
          if not pr_number.isdigit():
              raise SystemExit(f"Invalid pull request number: {pr_number}")

          def get_json(path):
              request = urllib.request.Request(
                  f"{api_root}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "sample-agent-skills-security-scan",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          changed_files = []
          page = 1
          while True:
              batch = get_json(
                  f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr_number}/files"
                  f"?per_page=100&page={page}"
              )
              changed_files.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          skill_names = set()
          for item in changed_files:
              parts = PurePosixPath(item["filename"]).parts
              if len(parts) >= 2 and parts[0] == "skills" and re.fullmatch(r"[a-z0-9-]+", parts[1]):
                  skill_names.add(parts[1])

          encoded_repository = urllib.parse.quote(repository, safe="/")
          tree = get_json(f"/repos/{encoded_repository}/git/trees/{head_sha}?recursive=1")
          if tree.get("truncated"):
              raise SystemExit("GitHub returned a truncated repository tree")

          output_root = Path("/tmp/skill-security-scan").resolve()
          output_root.mkdir(parents=True, exist_ok=True)

          for entry in tree["tree"]:
              source_path = PurePosixPath(entry["path"])
              if len(source_path.parts) < 2 or source_path.parts[0] != "skills":
                  continue
              if source_path.parts[1] not in skill_names:
                  continue
              if entry["type"] == "tree":
                  continue
              if entry["type"] != "blob" or entry["mode"] not in {"100644", "100755"}:
                  raise SystemExit(f"Unsupported repository entry: {entry['path']}")
              if any(part in {"", ".", ".."} for part in source_path.parts):
                  raise SystemExit(f"Unsafe repository path: {entry['path']}")
              if entry.get("size", 0) > 5_000_000:
                  raise SystemExit(f"Skill file exceeds 5 MB: {entry['path']}")

              destination = (output_root.joinpath(*source_path.parts)).resolve()
              if output_root not in destination.parents:
                  raise SystemExit(f"Skill file escapes scan directory: {entry['path']}")

              blob = get_json(f"/repos/{encoded_repository}/git/blobs/{entry['sha']}")
              if blob.get("encoding") != "base64":
                  raise SystemExit(f"Unsupported blob encoding: {entry['path']}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              encoded_content = "".join(blob["content"].split())
              destination.write_bytes(base64.b64decode(encoded_content, validate=True))
              destination.chmod(0o600)

          skill_files = []
          for skill_name in sorted(skill_names):
              skill_file = output_root / "skills" / skill_name / "SKILL.md"
              if skill_file.is_file():
                  skill_files.append(str(skill_file))

          Path("/tmp/skill-files").write_text(
              "".join(f"{skill_file}\n" for skill_file in skill_files),
              encoding="utf-8",
          )
          PY
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            find skills -mindepth 2 -maxdepth 2 -name SKILL.md -type f | sort > /tmp/skill-files
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- skills \
              | awk -F/ '$1 == "skills" && $2 ~ /^[a-z0-9-]+$/ { print $1 "/" $2 "/SKILL.md" }' \
              | sort -u \
              | while IFS= read -r skill_file; do
                  if [ -f "$skill_file" ]; then
                    printf '%s\n' "$skill_file"
                  fi
                done > /tmp/skill-files
          fi

          while IFS= read -r skill_file; do
            if [ -L "$skill_file" ] || [[ ! "$skill_file" =~ (^|/)skills/[a-z0-9-]+/SKILL\.md$ ]]; then
              echo "Invalid skill path: $skill_file" >&2
              exit 1
            fi
          done < /tmp/skill-files

          if [ -s /tmp/skill-files ]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Skills selected for scanning"
              echo
              sed 's/^/- `/' /tmp/skill-files | sed 's/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "No changed skills require scanning." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Snyk Agent Scan
        if: steps.snyk.outputs.enabled == 'true' && steps.targets.outputs.scan == 'true'
        run: python3 -m pip install --disable-pip-version-check snyk-agent-scan==0.6.0

      - name: Scan changed skills
        if: steps.snyk.outputs.enabled == 'true' && steps.targets.outputs.scan == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t skill_files < /tmp/skill-files
          snyk-agent-scan scan --json "${skill_files[@]}" > snyk-agent-scan.json

          risk_count=$(jq '[
            .scan_path_responses[]?
            | .skill_risks[]?
            | (.risk_indexes // {})
            | keys[]
          ] | length' snyk-agent-scan.json)

          failure_count=$(jq '[
            (.scan_path_responses[]? | .error? | select(.is_failure == true)),
            (.scan_path_responses[]? | .skill_risks[]? | .error? | select(.is_failure == true))
          ] | length' snyk-agent-scan.json)

          {
            echo "### Snyk Agent Scan results"
            echo
            echo "Security risks: **$risk_count**"
            echo
            echo "Operational failures: **$failure_count**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$risk_count" -ne 0 ]; then
            {
              echo
              echo "#### Reported risks"
              echo
              jq -r '
                .scan_path_responses[]?
                | .skill_risks[]?
                | .name as $skill
                | (.risk_indexes // {})
                | to_entries[]
                | "- `\($skill)`: `\(.key)` (score \(.value.score)/1000)"
              ' snyk-agent-scan.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$risk_count" -ne 0 ] || [ "$failure_count" -ne 0 ]; then
            exit 1
          fi
